<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ostrowska Z55</title>
</head>
<body>
<script>
var a_ost=parseInt(prompt("Podaj wysokość"));
var b_ost=parseInt(prompt("Podaj szerokość"));
var wiersz_ost="";
for(var i_ost=1;i_ost<=b_ost;i_ost++)
{
wiersz_ost=wiersz_ost+"*";
}
document.write(wiersz_ost+"<br>");
for(var i_ost=2;i_ost<a_ost;i_ost++)
{
var srodek_ost="*";
for(var k_ost=2;k_ost<b_ost;k_ost++)
{
srodek_ost=srodek_ost+"&nbsp;&nbsp;";
}
srodek_ost=srodek_ost+"*";
document.write(srodek_ost+"<br>");
}
document.write(wiersz_ost);
</script>
</body>
</html>
