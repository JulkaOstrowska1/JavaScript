<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ostrowska Z51</title>
</head>
<body>
<script>
var n_ost=parseInt(prompt("Podaj n"));
var silnia_ost=1;
if(n_ost==0)
{
document.write("0!=1");
}
else
{
for(var i_ost=1;i_ost<=n_ost;i_ost++)
{
silnia_ost=silnia_ost*i_ost;
}
document.write(n_ost+"!="+silnia_ost);
}
</script>
</body>
</html>
