<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ostrowska Z49</title>
</head>
<body>
<div style="color:navy;font-size:40px;">
<script>
do
{
var a_ost=prompt("bok a =","");
var a=parseFloat(a_ost);
var b_ost=prompt("bok b =","");
var b=parseFloat(b_ost);
var c_ost=prompt("bok c =","");
var c=parseFloat(c_ost);
}
while( a<=0 || b<=0 || c<=0 || a+b<=c || a+c<=b || b+c<=a );
document.write("Podane boki tworzą trójkąt.<br>");
document.write("a = "+a+"<br>");
document.write("b = "+b+"<br>");
document.write("c = "+c+"<br>");
</script>
</div>
</body>
</html>
