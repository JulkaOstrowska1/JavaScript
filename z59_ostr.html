<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ostrowska Z59</title>
</head>
<body>
<script>
for(var i_ost=20;i_ost<=35;i_ost++)
{
var pierw2_ost=Math.sqrt(i_ost);
var pierw4_ost=Math.sqrt(Math.sqrt(i_ost));
document.write("i="+i_ost+" pierw_2("+i_ost+")="+pierw2_ost.toFixed(2)+" pierw_4("+i_ost+")="+pierw4_ost.toFixed(2)+"<br>");
}
</script>
</body>
</html>
