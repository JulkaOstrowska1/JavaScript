<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ostrowska Z53</title>
</head>
<body>
<script>
var ile_ost=parseInt(prompt("Ile razy powtórzyć"));
var tekst_ost=prompt("Podaj inicjały");
for(var i_ost=1;i_ost<=ile_ost;i_ost++)
{
for(var k_ost=1;k_ost<=i_ost;k_ost++)
{
document.write("&nbsp;");
}
document.write(i_ost+"_"+tekst_ost+"_"+i_ost+"<br>");
}
</script>
</body>
</html>
